version: 2

models:
  - name: fct_revenue
    description: >
      Production revenue fact table generated by Synex AI Agent, grounded in DataHub
      metadata catalog. PII columns (customer_email, customer_phone) are SHA2-256 hashed
      at the transformation layer per governance policy. Excludes cancelled orders.
      Includes a 7-day rolling average of gross revenue partitioned by product category.
    config:
      materialized: table
      tags:
        - revenue
        - pii_masked
        - synex_generated

    columns:
      - name: order_id
        description: Unique identifier for the order (primary key).
        tests:
          - not_null
          - unique

      - name: order_date
        description: Date the order was placed.
        tests:
          - not_null

      - name: order_status
        description: Current status of the order. CANCELLED rows are excluded.
        tests:
          - not_null
          - accepted_values:
              values: ['COMPLETED', 'SHIPPED', 'PENDING', 'RETURNED']

      - name: customer_email_hashed
        description: >
          SHA2-256 hash of customer email address.
          [GOVERNANCE: Tier-1 PII — DataHub tag urn:li:tag:PII applied. Raw value never exposed.]
        tests:
          - not_null

      - name: customer_phone_hashed
        description: >
          SHA2-256 hash of customer phone number.
          [GOVERNANCE: Tier-1 PII — DataHub tag urn:li:tag:PII applied. Raw value never exposed.]
        tests:
          - not_null

      - name: product_id
        description: Foreign key to the product dimension table.
        tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_id

      - name: product_category
        description: High-level product category used for revenue segmentation.
        tests:
          - not_null

      - name: quantity
        description: Number of units ordered.
        tests:
          - not_null

      - name: unit_price
        description: Price per unit at time of order in USD.
        tests:
          - not_null

      - name: gross_revenue_usd
        description: Total gross revenue for this order row (quantity × unit_price).
        tests:
          - not_null

      - name: revenue_7d_rolling_avg
        description: >
          7-day rolling average of gross_revenue_usd, partitioned by product_category
          and ordered by order_date.

      - name: dbt_updated_at
        description: Timestamp when this row was last processed by dbt.
        tests:
          - not_null
