<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synex Layout Option 2: Side-by-Side Split</title>
    <style>
        :root {
            --bg: #060913;
            --surface: #0D1527;
            --border: #1E293B;
            --accent: #00E5FF;
            --success: #05F29B;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }
        /* Sidebar */
        .sidebar {
            width: 64px;
            background: #04060C;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            gap: 24px;
        }
        .logo {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: 1px solid var(--accent);
            background: rgba(0, 229, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            font-weight: bold;
        }
        .nav-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            cursor: pointer;
            transition: 0.2s;
        }
        .nav-icon.active {
            background: rgba(0, 229, 255, 0.15);
            color: var(--accent);
        }
        /* Main Layout */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: row;
            height: 100%;
        }
        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 24px;
            gap: 20px;
            height: 100%;
        }
        /* Top Command Input */
        .command-bar {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .command-input {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: monospace;
            font-size: 14px;
            outline: none;
            resize: none;
            height: 44px;
        }
        .command-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }
        /* Split Pane Workspace */
        .split-view {
            flex: 1;
            display: flex;
            gap: 20px;
            min-height: 0; /* Important for inner scroll */
        }
        .pane {
            flex: 1;
            background: #080C16;
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .pane-header {
            background: var(--surface);
            padding: 10px 16px;
            font-size: 12px;
            border-bottom: 1px solid var(--border);
            color: var(--text-muted);
            font-weight: bold;
        }
        .pane-content {
            flex: 1;
            padding: 16px;
            font-family: monospace;
            font-size: 12px;
            color: #ccc;
            overflow-y: auto;
        }
        /* Right Panel */
        .right-panel {
            width: 320px;
            border-left: 1px solid var(--border);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">S</div>
        <div class="nav-icon active">💻</div>
        <div class="nav-icon">📊</div>
        <div class="nav-icon">⚙️</div>
    </div>
    <div class="main-container">
        <div class="workspace">
            <!-- Centered Header Command Bar -->
            <div class="command-bar">
                <textarea class="command-input" placeholder="Search tables or instruct Synex AI to build a model..."></textarea>
                <div class="command-actions">
                    <span style="font-size: 11px; color: var(--text-muted);">Press Enter to run</span>
                    <button class="btn">Execute</button>
                </div>
            </div>

            <!-- Split Panel: Logs Left, Code Right -->
            <div class="split-view">
                <!-- Left Pane: Trace Logs -->
                <div class="pane">
                    <div class="pane-header" style="color: var(--accent);">>_ SYSTEM TRACE LOG</div>
                    <div class="pane-content" style="color: var(--text-muted);">
                        <p style="color: var(--accent); margin-bottom: 6px;">[14:22:01] INFO: Initializing Synex Kernel...</p>
                        <p>[14:22:02] DEBUG: Connecting to GMS...</p>
                    </div>
                </div>

                <!-- Right Pane: Code Sandbox -->
                <div class="pane">
                    <div class="pane-header">model.sql</div>
                    <div class="pane-content">
                        <span style="color: #c678dd;">SELECT</span> * <span style="color: #c678dd;">FROM</span> transformed;
                    </div>
                </div>
            </div>
        </div>

        <div class="right-panel">
            <h3 style="font-size: 14px; text-transform: uppercase; tracking-wider;">Aspect Inspector</h3>
            <hr style="border: none; border-top: 1px solid var(--border);">
            <p style="font-size: 12px; color: var(--text-muted);">Select a table to view aspects.</p>
        </div>
    </div>
</body>
</html>
