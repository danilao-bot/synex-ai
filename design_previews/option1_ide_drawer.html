<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synex Layout Option 1: IDE Drawer</title>
    <style>
        :root {
            --bg: #060913;
            --surface: #0D1527;
            --border: #1E293B;
            --accent: #00E5FF;
            --success: #05F29B;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }
        /* Sidebar */
        .sidebar {
            width: 64px;
            background: #04060C;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            gap: 24px;
        }
        .logo {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: 1px solid var(--accent);
            background: rgba(0, 229, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            font-weight: bold;
        }
        .nav-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            cursor: pointer;
            transition: 0.2s;
        }
        .nav-icon.active {
            background: rgba(0, 229, 255, 0.15);
            color: var(--accent);
        }
        /* Main Layout */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: row;
            height: 100%;
        }
        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 24px;
            gap: 20px;
            height: 100%;
        }
        /* Header Command Bar */
        .command-bar {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .command-input {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: monospace;
            font-size: 14px;
            outline: none;
            resize: none;
            height: 44px;
        }
        .command-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }
        /* Code Sandbox Area */
        .code-sandbox {
            flex: 1;
            background: #080C16;
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .sandbox-header {
            background: var(--surface);
            padding: 10px 16px;
            font-size: 12px;
            border-bottom: 1px solid var(--border);
            color: var(--text-muted);
        }
        .code-content {
            flex: 1;
            padding: 16px;
            font-family: monospace;
            color: #ccc;
            overflow-y: auto;
        }
        /* Collapsible Drawer (Trace Logs) */
        .drawer {
            background: #04060C;
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            transition: height 0.3s ease;
        }
        .drawer-header {
            padding: 12px 16px;
            background: var(--surface);
            border-radius: 12px 12px 0 0;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
            color: var(--accent);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
        }
        .drawer-content {
            padding: 16px;
            font-family: monospace;
            font-size: 11px;
            color: var(--text-muted);
            overflow-y: auto;
            height: 120px;
        }
        /* Right Panel */
        .right-panel {
            width: 320px;
            border-left: 1px solid var(--border);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">S</div>
        <div class="nav-icon active">💻</div>
        <div class="nav-icon">📊</div>
        <div class="nav-icon">⚙️</div>
    </div>
    <div class="main-container">
        <div class="workspace">
            <!-- Centered Header Command Bar -->
            <div class="command-bar">
                <textarea class="command-input" placeholder="Search tables or instruct Synex AI to build a model..."></textarea>
                <div class="command-actions">
                    <span style="font-size: 11px; color: var(--text-muted);">Press Enter to run</span>
                    <button class="btn">Execute</button>
                </div>
            </div>

            <!-- Main Code view -->
            <div class="code-sandbox">
                <div class="sandbox-header">model.sql</div>
                <div class="code-content">
                    <span style="color: #c678dd;">SELECT</span> * <span style="color: #c678dd;">FROM</span> transformed;
                </div>
            </div>

            <!-- Collapsible bottom drawer for logs -->
            <div class="drawer">
                <div class="drawer-header" onclick="toggleDrawer()">
                    <span>>_ SYSTEM TRACE LOG</span>
                    <span id="drawer-arrow">▼</span>
                </div>
                <div class="drawer-content" id="drawer-content">
                    <p style="color: var(--accent);">[14:22:01] INFO: System online.</p>
                    <p style="color: var(--text-muted);">[14:22:02] DEBUG: Waiting for prompt...</p>
                </div>
            </div>
        </div>

        <div class="right-panel">
            <h3 style="font-size: 14px; text-transform: uppercase; tracking-wider;">Aspect Inspector</h3>
            <hr style="border: none; border-top: 1px solid var(--border);">
            <p style="font-size: 12px; color: var(--text-muted);">Select a table to view aspects.</p>
        </div>
    </div>

    <script>
        let expanded = true;
        function toggleDrawer() {
            const content = document.getElementById('drawer-content');
            const arrow = document.getElementById('drawer-arrow');
            if (expanded) {
                content.style.display = 'none';
                arrow.textContent = '▲';
            } else {
                content.style.display = 'block';
                arrow.textContent = '▼';
            }
            expanded = !expanded;
        }
    </script>
</body>
</html>
